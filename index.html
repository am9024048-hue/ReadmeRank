<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadmeRank</title>
<style>
body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}.wrap{max-width:980px;margin:auto;padding:20px}.hero,.card{border-radius:18px}.hero{background:#111827;color:white;padding:32px;text-align:center}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:#d1d5db;line-height:1.6}.card{background:white;padding:20px;margin-top:18px;box-shadow:0 8px 28px #00000010}textarea{width:100%;min-height:330px;padding:14px;border:1px solid #d8dee9;border-radius:12px;box-sizing:border-box;font:14px/1.6 monospace}button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;background:#2563eb;color:white;font-weight:bold;font-size:17px}.scorebox{text-align:center}.score{font-size:72px;font-weight:800}.barbg{height:12px;background:#e5e7eb;border-radius:9px}.bar{height:100%;width:0;background:#2563eb}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}.stat{background:#f8fafc;padding:12px;border-radius:10px}.stat b{display:block;font-size:22px}.item{padding:14px;border:1px solid #e5e7eb;border-left:5px solid #dc2626;border-radius:12px;margin:9px 0}.good{border-left-color:#16a34a}.item h3{margin:0 0 6px;font-size:16px}.item p{margin:0;line-height:1.6}.small{font-size:13px;color:#64748b}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:32px}}
</style></head><body><div class="wrap">
<div class="hero"><h1>ReadmeRank</h1><p>Analyze any README, score its quality, discover missing documentation, and get practical recommendations.</p></div>
<div class="card"><label><b>Paste your README</b></label><textarea id="readme" placeholder="# My Project&#10;&#10;Describe what your project does..."></textarea><button id="analyze">🔍 Analyze README</button><p class="small">Free MVP: analysis runs locally in your browser.</p></div>
<div id="results" class="hidden"><div class="card scorebox"><h2>README Score</h2><div id="score" class="score">0</div><p id="summary"></p><div class="barbg"><div id="bar" class="bar"></div></div><div class="grid"><div class="stat"><b id="words">0</b>words</div><div class="stat"><b id="headings">0</b>headings</div><div class="stat"><b id="links">0</b>links</div><div class="stat"><b id="code">0</b>code blocks</div></div></div>
<div class="card"><h2>Detailed analysis</h2><div id="details"></div></div><div class="card"><h2>Top improvements</h2><ul id="tips"></ul></div></div></div>
<script>
const rules=[
["Clear project title",8,x=>/^\s*#(?!#)\s+\S+/m.test(x),"A clear H1 project title was detected.","Add a clear H1 title at the beginning of the README."],
["Project description",11,(x,s)=>s.words>=20&&s.lines.some(l=>l.trim()&&!/^\s*#/.test(l)),"Meaningful introductory content was detected.","Add a concise description explaining what the project does, who it helps, and the problem it solves."],
["Installation / setup",10,x=>/(^|\n)\s*#{1,6}\s*(installation|install|setup|getting started|quick start|prerequisites|requirements)\b/i.test(x)||/(npm\s+install|yarn\s+add|pnpm\s+add|pip\s+install|cargo\s+add|go\s+get|docker\s+run|git\s+clone)/i.test(x),"Installation or setup instructions were detected.","Add clear installation/setup steps so a new user can start quickly."],
["Usage / getting started",10,x=>/(^|\n)\s*#{1,6}\s*(usage|how to use|getting started|quick start|basic usage|examples?|demo)\b/i.test(x)||/(^|\n)\s*(run|start|use|import|require)\s+.{2,}/im.test(x),"Usage or getting-started guidance was detected.","Add a Usage or Getting Started section showing how users actually use the project."],
["Features",8,x=>/(^|\n)\s*#{1,6}\s*(features?|key features|capabilities|highlights|what it does|what you can do)\b/i.test(x)||/(^|\n)\s*[-*+]\s+.{4,}/m.test(x),"Features or capability information was detected.","Add a concise list of the project's most important features and benefits."],
["Requirements / dependencies",8,x=>/(^|\n)\s*#{1,6}\s*(requirements?|prerequisites?|dependencies|dependency|system requirements|supported versions?)\b/i.test(x)||/(node(?:\.js)?\s*v?\d+|python\s*\d+(?:\.\d+)?|java\s*\d+|ruby\s*\d+|go\s*\d+|rust\s*\d+|php\s*\d+|npm|yarn|pnpm|pip|package\.json|requirements\.txt)/i.test(x),"Requirements, versions, or dependencies were detected.","State the language/runtime version and important dependencies or prerequisites."],
["Practical examples",9,(x,s)=>s.code>0||/(^|\n)\s*#{1,6}\s*(examples?|usage|quick start|demo)\b/i.test(x),"A practical example or example section was detected.","Add a practical example or code block that demonstrates the project."],
["License",7,x=>/(^|\n)\s*#{1,6}\s*(license|licence|licensing)\b/i.test(x)||/\b(mit|apache(?:\s+license)?\s*2\.0|gpl(?:v?2|v?3)?|bsd|mpl\s*2\.0|isc|unlicense)\b/i.test(x)||/LICENSE(?:\.md|\.txt)?/i.test(x),"A license or license reference was detected.","Add a clear license and link to it when appropriate."],
["Contributing",5,x=>/(^|\n)\s*#{1,6}\s*(contributing|contribute|development|developing|pull requests?|how to contribute)\b/i.test(x),"Contribution/development guidance was detected.","Add contributing or development instructions if you want outside contributions."],
["Contact / community",5,x=>/(^|\n)\s*#{1,6}\s*(contact|community|support|discussions?|help|feedback)\b/i.test(x)||/(discord\.gg|discord\.com|t\.me\/|telegram|slack|matrix|mailto:|contact us|email us)/i.test(x),"A contact or community channel was detected.","Add a contact method, issue tracker, discussion area, or community link."],
["Useful links",6,(x,s)=>s.urls>0||/(^|\n)\s*#{1,6}\s*(links|resources|documentation|docs|demo|website|official site)\b/i.test(x),"Useful links or documentation were detected.","Add links to the demo, documentation, official website, package page, or repository resources."],
["Visuals / screenshots",4,x=>/!\[[^\]]*\]\([^)]*\)|<img\b|<video\b/i.test(x)||/(^|\n)\s*#{1,6}\s*(screenshots?|gallery|demo)\b/i.test(x),"An image, screenshot, gallery, or visual section was detected.","Consider adding a screenshot, GIF, or image that shows the product when visuals would help."],
["Readable structure",5,(x,s)=>s.headings>=2&&s.lines.length>=8,"The README has a usable heading structure.","Organize the README into clear sections with descriptive headings."]
];
function stats(x){return{lines:x.split(/\r?\n/),words:x.trim().split(/\s+/).filter(Boolean).length,headings:(x.match(/^\s*#{1,6}\s+\S.*$/gm)||[]).length,urls:(x.match(/https?:\/\/\S+/gi)||[]).length,code:(x.match(/```[\s\S]*?```/g)||[]).length}}
function analyze(){let x=document.getElementById("readme").value.trim();if(!x){alert("Paste a README first.");return}let s=stats(x),max=rules.reduce((a,r)=>a+r[1],0),raw=0,rows=[],tips=[];rules.forEach(r=>{let ok=!!r[2](x,s);if(ok){raw+=r[1];rows.push(["good","✅ "+r[0],r[3]])}else{rows.push(["","❌ "+r[0],r[4]]);tips.push(r[4])}});let bonus=s.words>=250?3:s.words>=120?2:s.words>=60?1:0,score=Math.round(Math.min(100,(raw+bonus)/(max+3)*100));document.getElementById("results").classList.remove("hidden");document.getElementById("score").textContent=score;document.getElementById("bar").style.width=score+"%";document.getElementById("words").textContent=s.words;document.getElementById("headings").textContent=s.headings;document.getElementById("links").textContent=s.urls;document.getElementById("code").textContent=s.code;document.getElementById("summary").textContent=score>=90?"🔥 Excellent README":score>=80?"🟢 Strong README":score>=70?"🟡 Good README with room to improve":score>=50?"🟠 README needs improvement":"🔴 README needs substantial improvement";let d=document.getElementById("details");d.innerHTML="";rows.forEach(r=>{let e=document.createElement("div");e.className="item "+r[0];e.innerHTML="<h3>"+r[1]+"</h3><p>"+r[2]+"</p>";d.appendChild(e)});let t=document.getElementById("tips");t.innerHTML="";[...new Set(tips)].slice(0,8).forEach(v=>{let e=document.createElement("li");e.textContent=v;t.appendChild(e)})}
document.getElementById("analyze").onclick=analyze;
</script></body></html>
