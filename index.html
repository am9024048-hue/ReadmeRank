<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadmeRank</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f6f8fa;
    }

    h1 {
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 220px;
      padding: 15px;
      box-sizing: border-box;
      margin: 15px 0;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 18px;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <h1>ReadmeRank</h1>

  <p>أدخل ملف README للحصول على تقييم سريع.</p>

  <textarea id="readme" placeholder="ضع محتوى README هنا..."></textarea>

  <button onclick="checkReadme()">تقييم README</button>

  <div id="result"></div>

  <script>
    function checkReadme() {
      const text = document.getElementById("readme").value;
      let score = 0;

      if (text.length > 100) score += 20;
      if (text.toLowerCase().includes("install")) score += 20;
      if (text.toLowerCase().includes("usage")) score += 20;
      if (text.includes("#")) score += 20;
      if (text.toLowerCase().includes("license")) score += 20;

      document.getElementById("result").innerHTML =
        "<h2>النتيجة: " + score + "/100</h2>";
    }
  </script>

</body>
    </html>
