<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReadmeRank — README Analyzer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}
.container{max-width:920px;margin:0 auto;padding:24px}
.hero{background:#111827;color:#fff;border-radius:22px;padding:34px 24px;text-align:center}
.hero h1{margin:0 0 10px;font-size:40px}.hero p{margin:0;color:#d1d5db;line-height:1.8}
.card{background:#fff;border-radius:18px;padding:24px;margin-top:20px;box-shadow:0 8px 28px rgba(15,23,42,.07)}
label{display:block;font-weight:700;margin-bottom:10px}
textarea{width:100%;min-height:300px;padding:16px;border:1px solid #d8dee9;border-radius:14px;font:14px/1.7 monospace;direction:ltr;resize:vertical}
button{width:100%;border:0;border-radius:13px;padding:15px;margin-top:14px;background:#2563eb;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
button:hover{opacity:.92}
.hidden{display:none}
.scorebox{text-align:center}.score{font-size:72px;font-weight:800;margin:6px 0}
.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:18px 0}
.bar{height:100%;width:0;background:#2563eb;transition:width .7s}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:#f8fafc;border-radius:12px;padding:14px}.stat strong{display:block;font-size:22px;margin-bottom:4px}
.item{padding:16px;border:1px solid #e5e7eb;border-radius:13px;margin:10px 0;border-right:5px solid #94a3b8}
.good{border-right-color:#16a34a}.warn{border-right-color:#f59e0b}.bad{border-right-color:#dc2626}
.item h3{margin:0 0 7px;font-size:17px}.item p{margin:0;line-height:1.7}
ul{line-height:2;padding-right:24px}
.small{color:#64748b;font-size:13px}
@media(max-width:650px){.container{padding:12px}.hero h1{font-size:31px}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="container">
<section class="hero">
<h1>ReadmeRank</h1>
<p>حلّل README الخاص بمشروعك، احصل على درجة من 100، واعرف بالضبط كيف تحسّنه.</p>
</section>

<section class="card">
<label for="readme">الصق README هنا</label>
<textarea id="readme" placeholder="# My Project

وصف المشروع...

## Installation
...

## Usage
..."></textarea>
<button onclick="analyze()">🔍 تحليل README</button>
<p class="small">التحليل يتم داخل المتصفح في هذه النسخة.</p>
</section>

<section id="results" class="hidden">
<div class="card scorebox">
<h2>النتيجة</h2>
<div id="score" class="score">0</div>
<div id="summary"></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<div class="stats">
<div class="stat"><strong id="words">0</strong>كلمة</div>
<div class="stat"><strong id="sections">0</strong>أقسام</div>
<div class="stat"><strong id="links">0</strong>روابط</div>
<div class="stat"><strong id="code">0</strong>أمثلة كود</div>
</div>
</div>

<div class="card">
<h2>📊 التحليل التفصيلي</h2>
<div id="details"></div>
</div>

<div class="card">
<h2>💡 أهم التحسينات</h2>
<ul id="tips"></ul>
</div>
</section>
</div>

<script>
const rules=[
 {name:"عنوان واضح", points:8, patterns:[/^#\s+\S+/m], good:"يوجد عنوان رئيسي واضح.", bad:"أضف عنوانًا واضحًا في بداية README."},
 {name:"وصف المشروع", points:10, patterns:[/(what|about|description|overview|project|problem|tool|library|framework|platform|is a|helps|provides)/i], minWords:25, good:"يوجد شرح أولي للمشروع.", bad:"أضف وصفًا مختصرًا يوضح ما المشكلة التي يحلها المشروع وما الذي يقدمه."},
 {name:"التثبيت والبدء", points:10, patterns:[/(installation|install|setup|getting started|quick start|ال(تثبيت|تنصيب)|بدء)/i], good:"يوجد قسم أو تعليمات للتثبيت والبدء.", bad:"أضف Installation أو Setup أو Getting Started بخطوات واضحة."},
 {name:"الاستخدام", points:10, patterns:[/(usage|how to use|example usage|use it|الاستخدام|طريقة الاستخدام)/i], good:"يوجد شرح للاستخدام.", bad:"أضف Usage يوضح للمستخدم كيف يبدأ باستخدام المشروع."},
 {name:"المميزات", points:8, patterns:[/(features|key features|capabilities|المميزات|المزايا|الخصائص)/i], good:"المميزات موضحة.", bad:"أضف قائمة بأهم المميزات والفوائد."},
 {name:"المتطلبات", points:7, patterns:[/(requirements|prerequisites|dependencies|requirements\.txt|package\.json|المتطلبات)/i], good:"المتطلبات أو الاعتماديات مذكورة.", bad:"اذكر إصدار اللغة والاعتماديات والمتطلبات اللازمة."},
 {name:"أمثلة عملية", points:10, patterns:[/(examples?|demo|sample|مثال|أمثلة|```)/i], good:"يوجد مثال أو كود عملي.", bad:"أضف مثالًا عمليًا أو Code Block يوضح الاستخدام."},
 {name:"الترخيص", points:7, patterns:[/(license|licence|mit license|apache license|gpl|bsd|الترخيص|الرخصة)/i], good:"يوجد ترخيص واضح أو إشارة إليه.", bad:"أضف License واضحًا للمشروع."},
 {name:"المساهمة", points:5, patterns:[/(contributing|contribution|pull request|ساهم|المساهمة)/i], good:"توجد معلومات عن المساهمة.", bad:"أضف Contributing Guide إذا كنت تريد استقبال مساهمات."},
 {name:"التواصل والمجتمع", points:5, patterns:[/(contact|discord|slack|telegram|community|email|تواصل|المجتمع)/i], good:"توجد وسيلة تواصل أو مجتمع.", bad:"أضف وسيلة تواصل أو رابط المجتمع."},
 {name:"روابط مفيدة", points:5, patterns:[/https?:\/\/\S+/i], good:"توجد روابط مفيدة.", bad:"أضف روابط للـDemo أو Documentation أو الموقع الرسمي."},
 {name:"صور أو لقطات", points:5, patterns:[/!\[[^\]]*\]\([^)]+\)|<img\b/i], good:"توجد صورة أو Screenshot.", bad:"أضف Screenshot أو صورة توضح المنتج عند الحاجة."}
];

function hasAny(text,patterns){return patterns.some(p=>p.test(text))}
function analyze(){
 const text=document.getElementById("readme").value.trim();
 if(!text){alert("الصق README أولًا.");return}
 const words=text.split(/\s+/).filter(Boolean).length;
 const sections=(text.match(/^#{1,6}\s+.+/gm)||[]).length;
 const links=(text.match(/https?:\/\/\S+/g)||[]).length;
 const code=(text.match(/```[\s\S]*?```/g)||[]).length;
 let score=0, details=[], tips=[];
 rules.forEach(r=>{
   let ok=hasAny(text,r.patterns);
   if(r.minWords && words<r.minWords) ok=false;
   if(ok){score+=r.points;details.push({c:"good",t:"✅ "+r.name,p:r.good})}
   else{details.push({c:"bad",t:"❌ "+r.name,p:r.bad});tips.push(r.bad)}
 });
 if(words>=300){score=Math.min(100,score+5);details.push({c:"good",t:"✅ مستوى التفاصيل",p:"README يحتوي على قدر جيد من التفاصيل."})}
 else{details.push({c:"warn",t:"⚠️ مستوى التفاصيل",p:"README قصير نسبيًا؛ أضف تفاصيل عملية عند الحاجة."});tips.push("أضف مزيدًا من التفاصيل العملية، لكن بدون حشو.")}

 score=Math.min(100,score);
 document.getElementById("results").classList.remove("hidden");
 document.getElementById("score").textContent=score;
 document.getElementById("bar").style.width=score+"%";
 document.getElementById("words").textContent=words;
 document.getElementById("sections").textContent=sections;
 document.getElementById("links").textContent=links;
 document.getElementById("code").textContent=code;

 let summary=score>=85?"🔥 README ممتازة":score>=70?"🟢 README جيدة":score>=50?"🟡 README متوسطة وتحتاج تحسينات":"🔴 README تحتاج تحسينًا واضحًا";
 document.getElementById("summary").textContent=summary;

 const box=document.getElementById("details");box.innerHTML="";
 details.forEach(x=>{const d=document.createElement("div");d.className="item "+x.c;d.innerHTML="<h3>"+x.t+"</h3><p>"+x.p+"</p>";box.appendChild(d)});
 const tip=document.getElementById("tips");tip.innerHTML="";
 [...new Set(tips)].forEach(t=>{const li=document.createElement("li");li.textContent=t;tip.appendChild(li)});
 document.getElementById("results").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
